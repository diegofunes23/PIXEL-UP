  <style>
    :root {
      --ink: #10152b;
      --muted: #68708b;
      --purple: #7657f6;
      --purple-dark: #5b3fe0;
      --lavender: #f3f1ff;
      --line: #e8e8f2;
      --orange: #ff9a62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: #fcfcff;
      font-family: "DM Sans", sans-serif;
    }

    .navbar {
      background: rgba(35, 8, 48, .96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(191, 119, 255, .2);
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    h1, h2, h3, .price {
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: -0.02em;
    }

    .brand-logo {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .hero-section {
      padding: 80px 0 60px;
      background: radial-gradient(circle at 80% 20%, rgba(118, 87, 246, 0.08), transparent 45%);
    }

    .pill-tag {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #fff3eb;
      color: #d96b27;
      border: 1px solid #ffe2cf;
    }

    .btn-purple {
      background: var(--purple);
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 12px 24px;
      border: 1px solid var(--purple);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-purple:hover {
      background: var(--purple-dark);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-outline-purple {
      background: #fff;
      color: var(--purple);
      font-weight: 600;
      border-radius: 12px;
      padding: 12px 24px;
      border: 1px solid #dcd6fc;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-outline-purple:hover {
      background: var(--lavender);
      color: var(--purple-dark);
      border-color: var(--purple);
    }

      max-width: 760px;
      margin: 0 auto;
      border-radius: 20px;
      overflow: hidden;

      border: 1px solid var(--line);
      user-select: none;
    }

    .compare-img {
      display: block;
      width: 100%;
      height: 440px;
      object-fit: cover;
    }
